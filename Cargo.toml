[workspace]
resolver = "3"
members = ["crates/tuxdrop-core", "crates/tuxdrop", "crates/tuxdropd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tuxdrop-core = { path = "crates/tuxdrop-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
