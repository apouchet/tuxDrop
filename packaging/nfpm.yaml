# Builds both the .deb and the .rpm; run through scripts/package.sh.
name: tuxdrop
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Antoine Pouchet <antoine.pouchet@nexelec.fr>
license: MIT
description: |
  AirDrop-like file sharing for Linux.
  Speaks the LocalSend v2 protocol, so it works with the LocalSend apps on
  iPhone, Android, Windows and macOS on the same network.

contents:
  - src: target/docker/release/tuxdrop
    dst: /usr/bin/tuxdrop
    file_info:
      mode: 0755
  - src: target/docker/release/tuxdropd
    dst: /usr/bin/tuxdropd
    file_info:
      mode: 0755
  - src: packaging/tuxdropd.service
    dst: /usr/lib/systemd/user/tuxdropd.service
    file_info:
      mode: 0644
  - src: packaging/nautilus/tuxdrop.py
    dst: /usr/share/nautilus-python/extensions/tuxdrop.py
    file_info:
      mode: 0644
  - src: packaging/ufw/tuxdrop
    dst: /etc/ufw/applications.d/tuxdrop
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/firewalld/tuxdrop.xml
    dst: /usr/lib/firewalld/services/tuxdrop.xml
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/tuxdrop/README.md
    file_info:
      mode: 0644
  - src: docs/commands.md
    dst: /usr/share/doc/tuxdrop/commands.md
    file_info:
      mode: 0644

# Enable the user service for everyone on first install.
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh

# Binaries are built against glibc 2.36 (Debian bookworm) and need nothing else.
# Recommended: the Nautilus menu needs nautilus-python, the GNOME tray icon
# the AppIndicator extension (preinstalled on Ubuntu, to enable on Fedora),
# renaming a device from the tray zenity, copying a received message
# wl-clipboard.
overrides:
  deb:
    depends:
      - libc6 (>= 2.36)
    recommends:
      - python3-nautilus
      - gnome-shell-extension-appindicator
      - zenity
      - wl-clipboard
  rpm:
    depends:
      - glibc >= 2.36
    recommends:
      - (nautilus-python if nautilus)
      - (gnome-shell-extension-appindicator if gnome-shell)
      - zenity
      - wl-clipboard
